name: spike-demo
on:
  push:
    branches: [spike/on-device-demo]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Build for a device
        run: |
          CC="$(xcrun -sdk iphoneos -f clang) -isysroot $(xcrun -sdk iphoneos --show-sdk-path) -target arm64-apple-ios17.0" \
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 go build -trimpath -ldflags='-s -w' -buildmode=c-archive -o out/device/libmbdemo.a ./cmd/mbdemolib
          ls -l out/device
      - name: Build for the simulator
        run: |
          CC="$(xcrun -sdk iphonesimulator -f clang) -isysroot $(xcrun -sdk iphonesimulator --show-sdk-path) -target arm64-apple-ios17.0-simulator" \
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 go build -trimpath -ldflags='-s -w' -buildmode=c-archive -tags ios -o out/sim/libmbdemo.a ./cmd/mbdemolib
          ls -l out/sim
      - name: Link and measure
        run: |
          link() { # sdk target dir
            xcrun -sdk "$1" clang -target "$2" -isysroot "$(xcrun -sdk "$1" --show-sdk-path)" -I"out/$3" ios/spike/probe.c "out/$3/libmbdemo.a" \
              -framework CoreFoundation -framework Security -lresolv -Wl,-dead_strip -o "out/$3/probe"
          }
          link iphoneos arm64-apple-ios17.0 device
          link iphonesimulator arm64-apple-ios17.0-simulator sim
          xcrun strip -x out/device/probe
          echo "SIZE device executable: $(stat -f%z out/device/probe) bytes"
          echo "SIZE device gzip: $(gzip -c out/device/probe | wc -c) bytes"
      - name: The real service for a device
        run: |
          CC="$(xcrun -sdk iphoneos -f clang) -isysroot $(xcrun -sdk iphoneos --show-sdk-path) -target arm64-apple-ios17.0" \
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 go build -trimpath -ldflags='-s -w' -buildmode=c-archive -o out/svc/libsvc.a ./cmd/mbdemosvc
          ls -l out/svc
          echo 'int MBServiceProbe(void); int main(void){return MBServiceProbe()==1?0:1;}' > out/svc/p.c
          xcrun -sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$(xcrun -sdk iphoneos --show-sdk-path)" out/svc/p.c out/svc/libsvc.a -framework CoreFoundation -framework Security -framework IOKit -lresolv -Wl,-dead_strip -o out/svc/probe
          xcrun strip -x out/svc/probe
          echo "SIZE service device executable: $(stat -f%z out/svc/probe) bytes"
          echo "SIZE service device gzip: $(gzip -c out/svc/probe | wc -c) bytes"
      - name: Run on a simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if 'iPhone' in d['name']))")
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id" -b
          xcrun simctl spawn "$id" "$PWD/out/sim/probe"
