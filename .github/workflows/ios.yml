name: ios

on:
  push:
    paths:
      - "ios/**"
      - "testdata/pair/**"
      - "testdata/push/**"
      - "testdata/home/**"
      - "testdata/keys/**"
      - "internal/**"
      - "!internal/**/*_test.go"
      - "cmd/mbdemolib/**"
      - "go.mod"
      - "go.sum"
      - "testdata/demo/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "testdata/pair/**"
      - "testdata/push/**"
      - "testdata/home/**"
      - "testdata/keys/**"
      - "internal/**"
      - "!internal/**/*_test.go"
      - "cmd/mbdemolib/**"
      - "go.mod"
      - "go.sum"
      - "testdata/demo/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Select the newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Test MatchbloxKit
        run: swift test --package-path ios/MatchbloxKit
      - name: Build the app
        run: |
          brew install xcodegen
          make -C ios build
      - name: Measure the demo library
        run: |
          du -sk ios/build/MBDemo.xcframework/*/libmbdemo.a
          echo "SIZE xcframework: $(du -sk ios/build/MBDemo.xcframework | cut -f1) KiB"
          echo "SIZE machine.tar: $(stat -f%z ios/Matchblox/Demo/machine.tar) bytes"
      - name: The demo's library links no gopsutil or purego
        # Both reach system APIs by name at run time, which review scans for, so
        # the iOS build leaves them out (internal/host, internal/service).
        run: |
          if GOOS=ios CGO_ENABLED=1 go list -deps ./cmd/mbdemolib | grep -E 'gopsutil|purego'; then
            echo "gopsutil or purego is in the iOS library" >&2
            exit 1
          fi
      - name: Print the library's undefined symbols
        run: |
          xcrun nm -u ios/build/demolib/sim/libmbdemo.a | awk 'NF == 2 && $1 == "U" {print $2}' | sort -u | tee ios/build/demolib-undefined.txt
          echo "UNDEFINED $(wc -l < ios/build/demolib-undefined.txt) symbols"
      - name: The app holds the command table
        run: test -f ios/build/Build/Products/Debug-iphonesimulator/Matchblox.app/commands.json
      - name: The app holds the demo's machine
        run: test -f ios/build/Build/Products/Debug-iphonesimulator/Matchblox.app/machine.tar
      - name: Compile the app in Release
        # The same action, configuration and platform as the TestFlight archive,
        # without signing: an unsigned device build that links the demo library.
        # A compiler or linker failure here fails the PR, not the release.
        run: |
          mkdir -p ios/build
          if ! make -C ios release > ios/build/release.log 2>&1; then
            tail -n 100 ios/build/release.log
            exit 1
          fi
      - name: The device archive holds the demo's machine
        run: test -f ios/build/Matchblox.xcarchive/Products/Applications/Matchblox.app/machine.tar
      - name: Upload the Release compile log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-compile-log
          path: ios/build/release.log
          if-no-files-found: ignore
