name: Publish

# A v* tag gets its binaries: matchblox-{linux,darwin}-{amd64,arm64}, a
# .sha256 for each, a CycloneDX SBOM, and build provenance and SBOM
# attestations that `gh attestation verify` checks. The release is a draft
# until they are attached, then a pre-release until the install script installed it on each OS and arch;
# then it becomes the latest release, its docs go live, and Homebrew and the
# AUR get it.
#
# To publish a tag again (a failed run):
#   gh workflow run publish.yml --ref v0.1.0
# Dispatched ON the tag: the attestations name the ref the run started from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      # A cancelled leg would leave a release that misses one platform.
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      # Before checkout: a dispatch on a branch never gets to build.
      - name: Resolve and validate the tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ] || [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing to publish $REF_TYPE '$TAG': dispatch this workflow on a release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a release binary does not depend on what earlier runs left.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # -buildvcs=false: the stamp is the only version the binary carries.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bin="matchblox-${GOOS}-${GOARCH}"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=${TAG}" -o "$bin" ./cmd/matchblox
          sha256sum "$bin" > "$bin.sha256"

      # The verify job runs every binary on its own OS and arch; this one runs
      # here, before anything is signed.
      - name: The binary names its tag
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          got="$(./matchblox-linux-amd64 version)"
          [ "$got" = "$TAG" ] || { echo "the binary says '$got', not '$TAG'" >&2; exit 1; }

      # From the binary, not go.mod: the SBOM lists what was linked in. The
      # tool is pinned through the Go checksum database, and runs in a job
      # that cannot sign.
      - name: Generate the SBOM
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bin="matchblox-${GOOS}-${GOARCH}"
          env -u GOOS -u GOARCH go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 \
            bin -json -version "$TAG" -output "$bin.cdx.json" "$bin"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matchblox-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matchblox-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest and attach (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the release assets
      id-token: write # sign the attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: matchblox-${{ matrix.target }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: matchblox-${{ matrix.target }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: matchblox-${{ matrix.target }}
          sbom-path: matchblox-${{ matrix.target }}.cdx.json

      # The tag can exist a moment before its release object; wait for it
      # rather than create one that races the other legs.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$TAG" >/dev/null 2>&1 || { echo "no release for $TAG after 120 s" >&2; exit 1; }
          bin="matchblox-${TARGET}"
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != true ]; then
            # Published releases are immutable: a re-run finds its assets there.
            have="$(gh release view "$TAG" --json assets -q '.assets[].name')"
            for f in "$bin" "$bin.sha256" "$bin.cdx.json"; do
              grep -qxF "$f" <<<"$have" || { echo "$TAG is published without $f: publish a new version (RELEASING.md)" >&2; exit 1; }
            done
            echo "$TAG is published with $bin"
            exit 0
          fi
          gh release upload "$TAG" "$bin" "$bin.sha256" "$bin.cdx.json" --clobber

  # Every binary attached: the draft becomes a pre-release, the moment the
  # release turns immutable. The install script can fetch it from here on.
  publish:
    name: Publish the pre-release
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          n="$(gh release view "$TAG" --json assets -q '.assets | length')"
          [ "$n" = 12 ] || { echo "$TAG has $n assets, not 12" >&2; exit 1; }
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease
          fi

  # The release, installed the way a builder installs it: the real
  # `curl -fsSL https://matchblox.sh | sh`, on each OS and arch.
  verify:
    name: Verify (${{ matrix.os }})
    needs: [build, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read # gh attestation verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    steps:
      - name: curl -fsSL https://matchblox.sh | sh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bin"
          curl -fsSL https://matchblox.sh |
            MATCHBLOX_VERSION="$TAG" MATCHBLOX_BIN_DIR="$dir" MATCHBLOX_NO_START=1 sh | tee "$RUNNER_TEMP/install.log"
          grep -q "checksum  ok" "$RUNNER_TEMP/install.log"
          grep -q "provenance ok" "$RUNNER_TEMP/install.log"
          got="$("$dir/matchblox" version)"
          [ "$got" = "$TAG" ] || { echo "matchblox version says '$got', not '$TAG'" >&2; exit 1; }
          echo "verified $TAG on $(uname -s)/$(uname -m)"

      - name: The SBOM is attested
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/bin/matchblox" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/publish.yml" \
            --source-ref "refs/tags/$TAG" \
            --predicate-type https://cyclonedx.org/bom

  # Verified: the release becomes the latest, unless a newer one is.
  promote:
    name: Make it the latest release
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.promote.outputs.latest }}
    steps:
      - name: Promote
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          newest="$(gh api "repos/$GH_REPO/tags" --paginate -q '.[].name' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$newest" = "$TAG" ]; then
            gh release edit "$TAG" --prerelease=false --latest
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            gh release edit "$TAG" --prerelease=false --latest=false
            echo "$TAG is published; $newest stays the latest"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  latest:
    name: The latest installs
    needs: [build, promote]
    if: needs.promote.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: curl -fsSL https://matchblox.sh | sh
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bin"
          curl -fsSL https://matchblox.sh | MATCHBLOX_BIN_DIR="$dir" MATCHBLOX_NO_START=1 sh
          got="$("$dir/matchblox" version)"
          [ "$got" = "$TAG" ] || { echo "the latest install says '$got', not '$TAG'" >&2; exit 1; }

  # The latest release goes to Homebrew and the AUR, as packages of the
  # binaries above: nothing builds again. Each one waits for its secret
  # (RELEASING.md); without it, the step says so and the release goes on.
  packages:
    name: Homebrew and the AUR
    needs: [build, promote]
    if: needs.promote.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write the formula and the PKGBUILD
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern 'matchblox-*.sha256' --dir "$RUNNER_TEMP/sums"
          .github/scripts/packages.sh "$TAG" "$RUNNER_TEMP/sums" "$RUNNER_TEMP/packages"

      - name: Push the formula to blox-eng/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN: the Homebrew tap keeps its last release (RELEASING.md)"
            exit 0
          fi
          tap="$RUNNER_TEMP/tap"
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/blox-eng/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/packages/Formula/matchblox.rb" "$tap/Formula/matchblox.rb"
          cd "$tap"
          git add Formula/matchblox.rb
          if git diff --cached --quiet; then
            echo "the tap has $TAG already"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "matchblox ${TAG#v}"
          git push -q origin HEAD

      # The AUR host key is pinned to the fingerprint the AUR publishes on
      # https://aur.archlinux.org: a changed key stops the push.
      - name: Push the package to the AUR (matchblox-bin)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::No AUR_SSH_KEY: the AUR package keeps its last release (RELEASING.md)"
            exit 0
          fi
          ssh="$RUNNER_TEMP/ssh"
          mkdir -m 700 "$ssh"
          (umask 077 && printf '%s\n' "$AUR_SSH_KEY" >"$ssh/key")
          ssh-keyscan -t ed25519 aur.archlinux.org >"$ssh/known_hosts" 2>/dev/null
          fp="$(ssh-keygen -lf "$ssh/known_hosts" | cut -d' ' -f2)"
          [ "$fp" = "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4" ] ||
            { echo "aur.archlinux.org has the host key $fp, not the one the AUR publishes" >&2; exit 1; }
          export GIT_SSH_COMMAND="ssh -i $ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh/known_hosts -o StrictHostKeyChecking=yes"
          aur="$RUNNER_TEMP/aur"
          git clone -q ssh://aur@aur.archlinux.org/matchblox-bin.git "$aur"
          cp "$RUNNER_TEMP/packages/aur/PKGBUILD" "$RUNNER_TEMP/packages/aur/.SRCINFO" "$aur/"
          cd "$aur"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "the AUR has $TAG already"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "matchblox ${TAG#v}"
          git push -q origin HEAD:master

  docs:
    name: Docs
    needs: promote
    if: needs.promote.outputs.latest == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
