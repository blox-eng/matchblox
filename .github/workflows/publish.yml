name: Publish

# A v* tag gets its binaries: matchblox-{linux,darwin}-{amd64,arm64}, a
# .sha256 for each, a CycloneDX SBOM, and build provenance and SBOM
# attestations that `gh attestation verify` checks. Then the verify job
# installs the release the way a builder does, on each OS and arch, and
# fails the release when anything is missing or wrong.
#
# To publish a tag again (a failed run):
#   gh workflow run publish.yml --ref v0.1.0
# Dispatched ON the tag: the attestations name the ref the run started from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the release assets
      id-token: write # sign the attestations
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      # A cancelled leg would leave a release that misses one platform.
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      # Before checkout: a dispatch on a branch never gets to build and sign.
      - name: Resolve and validate the tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ] || [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing to publish $REF_TYPE '$TAG': dispatch this workflow on a release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a release binary does not depend on what earlier runs left.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bin="matchblox-${GOOS}-${GOARCH}"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "$bin" ./cmd/matchblox
          sha256sum "$bin" > "$bin.sha256"

      # The linux/amd64 leg runs here, so the stamp is checked before upload;
      # the verify job runs every binary on its own OS and arch.
      - name: The binary names its tag
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          got="$(./matchblox-linux-amd64 version)"
          [ "$got" = "$TAG" ] || { echo "the binary says '$got', not '$TAG'" >&2; exit 1; }

      # From the binary, not go.mod: the SBOM lists what was linked in. The
      # tool is pinned through the Go checksum database.
      - name: Generate the SBOM
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bin="matchblox-${GOOS}-${GOARCH}"
          env -u GOOS -u GOARCH go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 \
            bin -json -version "$TAG" -output "$bin.cdx.json" "$bin"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: matchblox-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: matchblox-${{ matrix.goos }}-${{ matrix.goarch }}
          sbom-path: matchblox-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json

      # The tag can exist a moment before its release object; wait for it
      # rather than create one that races the other legs.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$TAG" >/dev/null 2>&1 || { echo "no release for $TAG after 120 s" >&2; exit 1; }
          bin="matchblox-${GOOS}-${GOARCH}"
          gh release upload "$TAG" "$bin" "$bin.sha256" "$bin.cdx.json" --clobber

  # The release, installed the way a builder installs it: the real
  # `curl -fsSL https://matchblox.sh | sh`, on each OS and arch.
  verify:
    name: Verify (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read # gh attestation verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest]
    steps:
      - name: curl -fsSL https://matchblox.sh | sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          # The latest release installs with no version named; an older tag
          # published again is named.
          pin=""
          [ "$(gh release view --json tagName -q .tagName)" = "$TAG" ] || pin="$TAG"
          dir="$RUNNER_TEMP/bin"
          curl -fsSL https://matchblox.sh |
            MATCHBLOX_VERSION="$pin" MATCHBLOX_BIN_DIR="$dir" MATCHBLOX_NO_START=1 sh | tee "$RUNNER_TEMP/install.log"
          grep -q "checksum  ok" "$RUNNER_TEMP/install.log"
          grep -q "provenance ok" "$RUNNER_TEMP/install.log"
          got="$("$dir/matchblox" version)"
          [ "$got" = "$TAG" ] || { echo "matchblox version says '$got', not '$TAG'" >&2; exit 1; }
          echo "verified $TAG on $(uname -s)/$(uname -m)"

      - name: The SBOM is attested
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/bin/matchblox" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/publish.yml" \
            --source-ref "refs/tags/$TAG" \
            --predicate-type https://cyclonedx.org/bom
