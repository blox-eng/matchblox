name: Canary

# Each day, run the latest Claude Code, Codex and OpenCode against a stand-in
# model and check that matchblox still reads each one's approval menu. A
# break opens one issue labelled canary.
#
# Two jobs, because the canary job installs and runs agent code nobody here
# reviewed: it holds no write token and no secret, and hands its results on
# as an artifact. Only report, which runs matchblox's own script on them,
# may write issues, and it never runs on a pull request.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - internal/said/**
      - testdata/menus/**
      - .github/workflows/canary.yml
      - .github/scripts/canary-report.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  canary:
    name: Canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: CI's other jobs on main would restore what agent code wrote.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # One step per agent, each continue-on-error: an agent that fails to
      # install is not installed, and the run says so for it alone.
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Install Codex
        continue-on-error: true
        run: npm install -g @openai/codex@latest
      - name: Install OpenCode
        continue-on-error: true
        run: npm install -g opencode-ai@latest
      # continue-on-error: a break must still reach report, which files it.
      - name: Run the canary
        id: run
        if: always()
        continue-on-error: true
        env:
          MATCHBLOX_CANARY_OUT: ${{ runner.temp }}/canary
        run: |
          mkdir -p "$MATCHBLOX_CANARY_OUT"
          go test -tags canary -run TestCanary -v -timeout 10m ./internal/said
      # warn, not error: a broken install still writes its could-not-run file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: canary
          path: ${{ runner.temp }}/canary
          retention-days: 7
          if-no-files-found: warn
      - name: A pull request that breaks the canary is red
        if: steps.run.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::error::the canary failed: the artifact canary holds each agent's result and screen"
          exit 1

  report:
    name: Report
    needs: canary
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Only to read canary-report.sh: matchblox's own commit, no token kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # continue-on-error: with no artifact, the script opens "the canary tested nothing".
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: canary
          path: ${{ runner.temp }}/canary
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/canary-report.sh "$RUNNER_TEMP/canary"
