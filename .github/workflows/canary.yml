name: Canary

# Each day, run the latest Claude Code, Codex and OpenCode against a stand-in
# model and check that matchblox still reads each one's approval menu. A
# break opens one issue labelled canary.
#
# Two jobs, because the canary job installs and runs agent code nobody here
# reviewed: it holds no write token and no secret, and hands its results on
# as an artifact. Only report, which runs matchblox's own script on them,
# may write issues, and it never runs on a pull request.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - internal/said/**
      - testdata/menus/**
      - .github/workflows/canary.yml
      - .github/scripts/canary-report.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  canary:
    name: Canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: CI's other jobs on main would restore what agent code wrote.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # The agents install and run as canary, a user with no sudo: the
      # runner's memory, its token and the caches main restores are out of
      # their reach. sudo and env -i hand them no runner variable. Only a run
      # shows the image's permissions, so each run proves that canary cannot
      # read the runner's folders or reach the metadata services.
      - name: Make the user canary
        id: user
        run: |
          sudo useradd --create-home --shell /bin/bash canary
          if id -nG canary | grep -qwE 'sudo|admin'; then echo "::error::canary is in sudo or admin"; exit 1; fi
          if sudo -u canary -H sudo -n true 2>/dev/null; then echo "::error::canary can sudo"; exit 1; fi
          if sudo -u canary -H test -r /home/runner; then echo "::error::canary can read /home/runner"; exit 1; fi
          for d in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if sudo -u canary -H test -r "$d"; then echo "::error::canary can read $d"; exit 1; fi
          done
          worker="$(pgrep -o -f Runner.Worker || true)"
          if [ -n "$worker" ] && bin="$(readlink -f "/proc/$worker/exe")"; then
            if sudo -u canary -H test -r "$(dirname "$bin")"; then echo "::error::canary can read the runner's folder"; exit 1; fi
          else
            echo "no Runner.Worker process found: canary's reach into the runner's folder is not checked"
          fi
          sudo iptables -I OUTPUT -m owner --uid-owner canary -d 168.63.129.16 -j REJECT
          sudo iptables -I OUTPUT -m owner --uid-owner canary -d 169.254.169.254 -j REJECT
          if sudo -u canary -H curl -sS -m 3 http://169.254.169.254/; then echo "::error::canary reaches 169.254.169.254"; exit 1; fi
          if sudo -u canary -H curl -sS -m 3 http://168.63.129.16/; then echo "::error::canary reaches 168.63.129.16"; exit 1; fi
          sudo -u canary -H env -i "$(command -v node)" --version
          sudo -u canary -H env -i "$(command -v go)" version
          echo "CANARY_PATH=$(dirname "$(command -v go)"):$(dirname "$(command -v node)"):/home/canary/.npm-global/bin:/usr/bin:/bin" >>"$GITHUB_ENV"
      # One step per agent, each continue-on-error: an agent that fails to
      # install is not installed, and the run says so for it alone.
      - name: Install Claude Code
        continue-on-error: true
        run: sudo -u canary -H env -i HOME=/home/canary PATH="$CANARY_PATH" npm install -g --prefix /home/canary/.npm-global @anthropic-ai/claude-code@latest
      - name: Install Codex
        continue-on-error: true
        run: sudo -u canary -H env -i HOME=/home/canary PATH="$CANARY_PATH" npm install -g --prefix /home/canary/.npm-global @openai/codex@latest
      - name: Install OpenCode
        continue-on-error: true
        run: sudo -u canary -H env -i HOME=/home/canary PATH="$CANARY_PATH" npm install -g --prefix /home/canary/.npm-global opencode-ai@latest
      # After a failed install, never after a user that may have sudo. It
      # runs on a copy canary owns, which the runner reads and canary writes:
      # the runner's workspace need not be readable to canary.
      # continue-on-error: a break must still reach report.
      - name: Run the canary
        id: run
        if: always() && steps.user.outcome == 'success'
        continue-on-error: true
        run: |
          sudo -u canary -H mkdir /home/canary/src /home/canary/out
          tar -C "$GITHUB_WORKSPACE" -cf - . | sudo -u canary -H tar -C /home/canary/src -xf -
          sudo -u canary -H env -i -C /home/canary/src HOME=/home/canary PATH="$CANARY_PATH" \
            GOCACHE=/home/canary/.cache/go-build GOMODCACHE=/home/canary/go/pkg/mod GOFLAGS=-mod=mod \
            MATCHBLOX_CANARY_OUT=/home/canary/out \
            go test -tags canary -run TestCanary -v -timeout 10m ./internal/said
      # Root never reads canary's files: a canary process could swap one for
      # a link to a file only root may read. So every canary process goes
      # first, then canary reads each result and the runner writes it.
      - name: Stop every canary process
        if: always()
        run: |
          for _ in 1 2 3 4 5; do
            sudo pkill -KILL -u canary || true
            pgrep -u canary >/dev/null || break
            sleep 1
          done
          if pgrep -u canary; then echo "::error::a canary process is still running"; exit 1; fi
      - name: Hand the results to the upload
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/canary"
          for k in claude codex opencode; do
            if sudo -u canary test -f "/home/canary/out/$k.json"; then
              sudo -u canary cat -- "/home/canary/out/$k.json" | head -c 1048576 >"$RUNNER_TEMP/canary/$k.json" || true
            fi
          done
      # warn, not error: a broken install still writes its could-not-run file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: canary
          path: ${{ runner.temp }}/canary
          retention-days: 7
          if-no-files-found: warn
      - name: A pull request that breaks the canary is red
        if: steps.run.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::error::the canary failed: the artifact canary holds each agent's result and screen"
          exit 1

  report:
    name: Report
    needs: canary
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Only to read canary-report.sh: matchblox's own commit, no token kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # continue-on-error: with no artifact, the script opens "the canary tested nothing".
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: canary
          path: ${{ runner.temp }}/canary
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/canary-report.sh "$RUNNER_TEMP/canary"
