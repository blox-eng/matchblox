name: Docs

# docs.matchblox.com shows the docs of the latest release. Until the first
# v* tag exists, it shows main: the install script builds main until then.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "config.example.toml"
      - "www/demo/replay.svg"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.when.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install mkdocs
        run: pip install --require-hashes --no-deps -r requirements-docs.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict
      - name: Deploy only from the latest source of truth
        id: when
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          deploy=false
          if [ "$EVENT" != pull_request ]; then
            case "$REF" in
              refs/tags/v*) deploy=true ;;
              *) [ -z "$(git tag -l 'v*')" ] && deploy=true ;;
            esac
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - if: steps.when.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy docs
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
