name: CI

# No paths-ignore: these jobs are required for merge, and a skipped required
# check never reports, so a docs-only pull request could never land.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: a renamed title is checked again before the squash takes it.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          allowed-commit-types: "feat,fix,chore,test,docs,refactor,ci,perf,build,revert"
      # The squash merge takes the pull request's title as the commit on main,
      # and a title semantic-release cannot read releases nothing (#54).
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -Eq '^(feat|fix|chore|test|docs|refactor|ci|perf|build|revert)(\([^)]+\))?!?: .+' <<<"$TITLE"; then
            echo "::error::The title becomes the squash commit on main: start it with a conventional type, as in 'fix: …'. Got: $TITLE"
            exit 1
          fi
      # A feat changes what a builder can do, so the landing page says it, or the
      # body says why not (owner, 2026-11-07): .github/scripts/landing-guard.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Landing page
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: origin/${{ github.base_ref }}
        run: |
          printf '%s' "$BODY" >"$RUNNER_TEMP/body"
          .github/scripts/landing-guard.sh "$TITLE" "$RUNNER_TEMP/body" "$BASE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Changelog documents the latest release
        run: .github/scripts/changelog-guard.sh
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
      - name: shellcheck
        run: shellcheck scripts/*.sh .github/scripts/*.sh www/install.sh
      - name: The landing page guard
        run: bash .github/scripts/landing-guard_test.sh

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    # macOS runners vary: the race tests took 6m44s and 9m31s on the same
    # code, so macOS gets room that a slow runner does not use up.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The jump tests drive two real tmux servers and a real sshd; without
      # them they skip, and the guard of #214 would pass unseen.
      # strace proves the demo's walk makes no socket and runs no command.
      # The runner image has all three. apt-get update runs only when one is
      # missing: on 2026-11-11 the Ubuntu mirrors timed out for 3m20s and
      # pushed the job past its limit.
      - name: tmux and sshd for the jump tests, strace for the demo's
        if: runner.os == 'Linux'
        run: |
          pkgs="tmux openssh-server strace"
          # shellcheck disable=SC2086 # one word per package
          if ! dpkg -s $pkgs >/dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y -q $pkgs
          fi
      # Two sentinel tmux servers stand in for the builder's: one that $TMUX
      # names, as when the tests run inside tmux, and the default server.
      # The suite must leave both alive (#215).
      - name: Sentinel tmux servers for the tests to leave alone
        if: runner.os == 'Linux'
        run: |
          tmux -S "$RUNNER_TEMP/sentinel" -f /dev/null new-session -d -s sentinel sleep 7200
          tmux -L default -f /dev/null new-session -d -s sentinel sleep 7200
      - name: Tests (race)
        env:
          CGO_ENABLED: '1'
          TMUX: ${{ runner.os == 'Linux' && format('{0}/sentinel,1,0', runner.temp) || '' }}
          TMUX_PANE: ${{ runner.os == 'Linux' && '%0' || '' }}
        # go test stops a package at 10 minutes by default; on macOS the app
        # package's race run reached 9m55s, so it gets the job's own room.
        run: go test -race -cover -timeout ${{ matrix.os == 'macos-latest' && '18m' || '10m' }} $(go list ./... | grep -v '/internal/demo$')
      # The demo's walks press every key of the console through a real service.
      # Under -race they took 8 minutes on Linux, against a 10 minute job, so
      # the race run is its own job (demo-race) and this run is without it.
      # The no-route-out test needs an unprivileged user namespace, which
      # Ubuntu's AppArmor restricts by default.
      - name: Allow user namespaces for the demo's no-route test
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Demo tests
        env:
          TMUX: ${{ runner.os == 'Linux' && format('{0}/sentinel,1,0', runner.temp) || '' }}
          TMUX_PANE: ${{ runner.os == 'Linux' && '%0' || '' }}
        run: go test -v -cover -timeout 10m ./internal/demo
      - name: The sentinel tmux servers are alive
        if: always() && runner.os == 'Linux'
        run: |
          for server in "-S $RUNNER_TEMP/sentinel" "-L default"; do
            # shellcheck disable=SC2086 # the flag and its socket are two words
            if ! tmux $server has-session -t '=sentinel'; then
              echo "::error::A test ended the sentinel tmux server ($server): a test's tmux names no server (-L or -S), or its package has no TestMain with testhome.Run (#215)"
              exit 1
            fi
          done
      - name: Fixture smoke run
        run: go run ./cmd/matchblox status --fixtures testdata/machine --text

  # The demo's console and service run over a pipe with draw loops and timers,
  # which is where a data race hides. Linux alone: on macOS the race run starves
  # the draw waits, and the code is the same.
  demo-race:
    name: Demo (race)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: strace for the demo's trace test
        run: sudo apt-get update -q && sudo apt-get install -y -q strace
      - name: Allow user namespaces for the demo's no-route test
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Demo tests (race)
        env:
          CGO_ENABLED: '1'
        run: go test -race -timeout 20m ./internal/demo

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          .github/scripts/vulncheck.sh

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build every target without cgo
        env:
          CGO_ENABLED: '0'
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o /dev/null ./cmd/matchblox
          done

  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The relay's tests use a fake fetch and keys made in the test: no
      # network, no Apple, no device. The glob is quoted for Node to expand:
      # on Node 22 `node --test worker/` runs worker/index.js as the only
      # "test" and passes without running one. The OpenCode plugin that
      # `matchblox setup` installs runs here too: Node 22 strips its types.
      - name: Tests
        run: node --test 'worker/*.test.js' 'internal/setup/*.test.js'
